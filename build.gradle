plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.2.2'
}

group = 'com.justsmart'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'com.justsmart.jobx.lsp.LspServer'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

shadowJar {
    archiveBaseName.set('cognex-jobx-lsp-server')
    archiveClassifier.set('all')
    manifest {
        attributes 'Main-Class': 'com.justsmart.jobx.lsp.LspServer',
                   'Implementation-Version': project.version
    }
}

tasks.named('jar') {
    enabled = false
}
